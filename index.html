<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#00d9ff;--purple:#8b5cf6;--bg:#050816}
body{min-height:100vh;background:var(--bg);color:#fff;font-family:Poppins,sans-serif;overflow-x:hidden}

canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 7%}
.logo{font-family:Orbitron;font-weight:900;font-size:17px;color:var(--blue);text-shadow:0 0 15px var(--blue)}
.status{font-size:9px;color:#00ffae;border:1px solid #00ffae66;padding:6px 10px;border-radius:30px;letter-spacing:.7px}
.hero{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:24px 15px}
.card{width:100%;max-width:460px;text-align:center;padding:34px 22px;border:1px solid #ffffff18;border-radius:26px;background:linear-gradient(145deg,#ffffff10,#ffffff03);backdrop-filter:blur(20px);box-shadow:0 0 60px #00d9ff12;animation:appear 1s ease}
@keyframes appear{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.avatar{width:100px;height:100px;margin:0 auto 20px;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--blue),var(--purple),var(--blue));box-shadow:0 0 32px #00d9ff55;animation:glow 3s infinite alternate}
.avatar-inner{width:100%;height:100%;border-radius:50%;background:#091326;display:grid;place-items:center;font-family:Orbitron;font-size:28px;font-weight:900;color:var(--blue)}
@keyframes glow{to{box-shadow:0 0 42px #8b5cf688}}
h1{font-family:Orbitron;font-size:clamp(23px,6vw,32px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#fff,var(--blue),#b58aff);background-clip:text;-webkit-background-clip:text;color:transparent}
.subtitle{color:#9baac3;font-size:10px;letter-spacing:3.5px;margin-top:9px}
.line{height:2px;width:65px;background:var(--blue);margin:19px auto;box-shadow:0 0 15px var(--blue)}
.description{color:#aab6ca;font-size:12px;line-height:1.8;margin-bottom:20px}
.clock{font-family:Orbitron;font-size:23px;color:var(--blue);text-shadow:0 0 15px #00d9ff66}
.date{color:#8999b4;font-size:10px;margin-top:7px}
.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:white;padding:10px 13px;min-height:38px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.55px;border:1px solid #00d9ff55;background:linear-gradient(100deg,#087bba,#4932a0);transition:.25s;cursor:pointer;white-space:nowrap}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 20px #00d9ff55}
.btn.capcut{width:100%;padding:12px 14px;min-height:43px;font-size:11px;background:linear-gradient(100deg,#00a9c9,#5136a9);border-color:#53eaff}
.btn.secondary{background:#ffffff08;border:1px solid #ffffff25}
.ripple{position:absolute;border-radius:50%;background:#ffffff55;transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(3);opacity:0}}
.sound{position:fixed;right:17px;bottom:17px;width:41px;height:41px;border-radius:50%;border:1px solid #00d9ff88;background:#07172b;color:var(--blue);font-size:17px;cursor:pointer;box-shadow:0 0 20px #00d9ff33}
footer{text-align:center;padding:18px;color:#66748b;font-size:10px}
footer span{color:var(--blue)}
@media(max-width:380px){.card{padding:29px 15px}.btn{font-size:9px;padding:9px 10px}.buttons{gap:7px}}

<script>
function updateClock(){
 const now=new Date();
 document.getElementById("clock").textContent=now.toLocaleTimeString("en-US");
 document.getElementById("date").textContent=now.toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
}
updateClock();setInterval(updateClock,1000);
let soundOn=true,audioContext;
function getCtx(){
 if(!audioContext){const AudioCtx=window.AudioContext||window.webkitAudioContext;if(AudioCtx)audioContext=new AudioCtx();}
 if(audioContext?.state==="suspended")audioContext.resume();
 return audioContext;
}
function tone(freq,start,dur,type="sine",volume=.1){
 if(!soundOn)return;const c=getCtx();if(!c)return;
 const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;
 g.gain.setValueAtTime(volume,c.currentTime+start);
 g.gain.exponentialRampToValueAtTime(.001,c.currentTime+start+dur);
 o.connect(g);g.connect(c.destination);o.start(c.currentTime+start);o.stop(c.currentTime+start+dur);
}
function clickSound(){tone(660,0,.15,"triangle",.15);tone(880,.08,.2,"triangle",.12);}
document.getElementById("sound").addEventListener("click",()=>{
 soundOn=!soundOn;document.getElementById("sound").textContent=soundOn?"🔊":"🔇";if(soundOn)clickSound();
});
document.querySelectorAll(".btn").forEach(btn=>{
 btn.addEventListener("click",e=>{
  clickSound();const r=btn.getBoundingClientRect(),size=Math.max(r.width,r.height),rip=document.createElement("span");
  rip.className="ripple";rip.style.width=rip.style.height=size+"px";
  rip.style.left=(e.clientX-r.left-size/2)+"px";rip.style.top=(e.clientY-r.top-size/2)+"px";
  btn.appendChild(rip);setTimeout(()=>rip.remove(),600);
 });
});
const canvas=document.getElementById("particles"),ctx=canvas.getContext("2d");let particles=[];
function resize(){
 canvas.width=innerWidth;canvas.height=innerHeight;
 particles=Array.from({length:65},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.5,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}));
}
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 particles.forEach(p=>{
  p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>canvas.width)p.vx*=-1;if(p.y<0||p.y>canvas.height)p.vy*=-1;
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="#00d9ff";ctx.shadowBlur=12;ctx.shadowColor="#00d9ff";ctx.fill();
 });
 requestAnimationFrame(animate);
}
addEventListener("resize",resize);resize();animate();
</script>
